[package]
name = "melodie-core"
description = "What every Mélodie program shares: Subsonic client, local copy, sync, search, mixes, playlists, likes, keyring store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The fake local server of the tests, for the tests of the crates built on this one.
fake = []

[dependencies]
anyhow = "1"
getrandom = "0.3"
md5 = "0.7"
rusqlite = { version = "0.37", features = ["bundled"] }
secret-service = { version = "5", default-features = false, features = ["rt-async-io-crypto-rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tempfile = "3"
