[package]
name = "melodie-gui"
description = "The window of Mélodie: the player and the queue, one more client of the daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["gpui-fast"]
# GPUI Fast behind gpui-kit (docs/gui-toolkit.md); without it, upstream GPUI from the same source.
gpui-fast = ["gpui-kit/gpui-fast"]
# Frame statistics for measuring the window (`MELODIE_GUI_FRAME_STATS`); off in the program people run.
frame-stats = ["gpui-kit/profiler"]

[dependencies]
anyhow = "1"
futures = "0.3"
gpui-kit = "=0.7.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
melodie-core = { path = "../melodie-core" }
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
