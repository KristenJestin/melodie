[package]
name = "melodie"
version = "0.0.0"
edition = "2024"
description = "A music player for Navidrome: background daemon, command line, local mixes"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
getrandom = "0.3"
libc = "0.2"
libmpv2 = "6"
md5 = "0.7"
rpassword = "7"
rusqlite = { version = "0.37", features = ["bundled"] }
secret-service = { version = "5", default-features = false, features = ["rt-async-io-crypto-rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2", features = ["json"] }
zbus = "5"

[dev-dependencies]
tempfile = "3"
