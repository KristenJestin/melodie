name: ci

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  commit-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The first push of a branch has no `before` (forty zeros): every commit it holds is checked.
      - name: Check the Angular commit convention
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          head="${{ github.event.pull_request.head.sha || github.sha }}"
          if [ -z "${base//0/}" ]; then
            tools/commit-message.sh --range "$head"
          else
            tools/commit-message.sh --range "$base..$head"
          fi
      # A pull request is squashed: its title becomes the commit subject.
      - name: Check the title of the pull request
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/title"
          tools/commit-message.sh "$RUNNER_TEMP/title"

  # No sound card, no server and no session bus here: the suites run against fakes (see AGENTS.md, Testing).
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `dbus` provides the `dbus-daemon` the daemon test starts privately; without it the MPRIS checks are skipped.
      # The rest is what the window (GPUI) links against: fonts, keyboard maps, Wayland and X11.
      - run: >-
          sudo apt-get update && sudo apt-get install -y libmpv-dev dbus
          libfontconfig-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev
          libx11-xcb-dev libvulkan-dev
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      # The window builds on upstream GPUI too, from the same source (docs/gui-toolkit.md).
      - run: cargo check -p melodie-gui --no-default-features --locked
